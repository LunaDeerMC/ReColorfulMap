name: Checks and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Test and build plugin
        run: bash ./gradlew --no-daemon build stageRelease
      - name: Test migration tooling
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts/tests -v
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(bash ./gradlew --no-daemon -q properties --property version | sed -n 's/^version: //p')
          test "$RELEASE_TAG" = "v$version"
      - name: Package offline migration
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          files = [
              'scripts/migrate-colorfulmap.sh',
              'scripts/migrate_colorfulmap.py',
              'scripts/nbt_codec.py',
              'scripts/region_codec.py',
              'scripts/requirements.txt',
              'scripts/README.md',
          ]
          archive = pathlib.Path('build/release/colorfulmap-migration.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for filename in files:
                  bundle.write(filename, arcname=filename)
          # Run outside the checkout so missing modules cannot be supplied by the source tree.
          with tempfile.TemporaryDirectory(prefix='migration-bundle-check-') as temporary:
              extracted = pathlib.Path(temporary)
              with zipfile.ZipFile(archive) as bundle:
                  assert sorted(bundle.namelist()) == sorted(files)
                  bundle.extractall(extracted)
              environment = os.environ.copy()
              environment.pop('PYTHONPATH', None)
              subprocess.run([sys.executable, 'scripts/migrate_colorfulmap.py', '--help'],
                             cwd=extracted, env=environment, check=True, stdout=subprocess.DEVNULL)
              subprocess.run([sys.executable, '-c', 'import migrate_colorfulmap, nbt_codec, region_codec'],
                             cwd=extracted / 'scripts', env=environment, check=True)
              subprocess.run(['bash', '-n', 'scripts/migrate-colorfulmap.sh'], cwd=extracted, check=True)
          print('Migration bundle is self-contained and preserves the documented scripts/ layout')
          PY
      - name: Save checked artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Save Java test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-results
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-release
          path: build/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" build/release/* \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
            --generate-notes --verify-tag "${options[@]}"
      - name: Publish Modrinth release
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import uuid

          token = os.environ['MODRINTH_TOKEN']
          if not token:
              raise SystemExit('MODRINTH_TOKEN is required to publish a tagged release')
          artifacts = list(pathlib.Path('build/release').glob('*.jar'))
          if len(artifacts) != 1:
              raise SystemExit('Expected exactly one checked plugin JAR')
          artifact = artifacts[0]
          tag = os.environ['RELEASE_TAG']
          metadata = {
              'name': tag,
              'version_number': tag,
              'project_id': 'OSGNJlhi',
              'version_type': 'beta' if '-' in tag else 'release',
              'changelog': f"See https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              'dependencies': [],
              'game_versions': ['1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '26.2'],
              'loaders': ['paper', 'purpur', 'folia'],
              'featured': False,
              'file_parts': ['plugin'],
              'primary_file': 'plugin',
          }
          boundary = uuid.uuid4().hex
          body = (
              f'--{boundary}\r\nContent-Disposition: form-data; name="data"\r\n'
              'Content-Type: application/json\r\n\r\n'
          ).encode() + json.dumps(metadata).encode() + (
              f'\r\n--{boundary}\r\nContent-Disposition: form-data; name="plugin"; filename="{artifact.name}"\r\n'
              'Content-Type: application/java-archive\r\n\r\n'
          ).encode() + artifact.read_bytes() + f'\r\n--{boundary}--\r\n'.encode()
          request = urllib.request.Request('https://api.modrinth.com/v2/version', data=body, headers={
              'Authorization': token,
              'Content-Type': f'multipart/form-data; boundary={boundary}',
              'User-Agent': 'LunaDeerMC/ReColorfulMap CI (https://github.com/LunaDeerMC/ReColorfulMap)',
          })
          with urllib.request.urlopen(request, timeout=120) as response:
              print('Published Modrinth version:', json.load(response)['id'])
          PY
      - name: Set up Java 17 for Hangar
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Publish Hangar release
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          jars=(build/release/*.jar)
          test "${#jars[@]}" -eq 1
          bash ./gradlew --no-daemon publishPluginPublicationToHangar -PcheckedReleaseJar="${jars[0]}"
