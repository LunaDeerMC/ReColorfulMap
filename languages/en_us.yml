reload-command:
  reloading-config: Reloading configuration file...
  reload-config-success: Configuration file reloaded successfully!
map-manage:
  usage: 'Usage: /mapmanage copy|status|cancel|list|claim <artwork UUID>'
  admin-usage: 'Admin: /mapmanage inspect <UUID> | recover <UUID> <online player> confirm | resolve <UUID> <pending|delivered|paid|unpaid|refunded> confirm'
  no-permission: You do not have permission to use this operation.
  idle: No image is currently being generated.
  queued: Your image is waiting for an available processing slot.
  running: Your image is being generated.
  cancelling: Your generation task is stopping.
  cancelled: Cancellation requested. If the image was already saved, you can find it with /mapmanage list.
  empty: You have no maps waiting for delivery.
  pending-entry: '%s — %s; creation price: %.2f. Use /mapmanage claim <UUID>.'
  ready: Ready to claim
  review: Awaiting administrator review
  not-owned: No map waiting for delivery was found with this UUID in your account.
  not-found: No delivery record was found for this UUID.
  already-delivered: This map has already been delivered. It cannot be claimed again.
  needs-review: The previous delivery could not be confirmed. Ask an administrator to check artwork %s before it can be claimed again.
  claim-in-progress: This map is already being prepared for delivery.
  insufficient-funds: Creating this map costs %.2f. Your balance is too low; the image was saved as %s for later claiming.
  delivery-uncertain: The map could not be delivered. Its image was kept; ask an administrator to check delivery before trying again.
  economy-unavailable: The economy service is unavailable. Your saved map can be claimed later.
  invalid-uuid: Please enter a valid artwork UUID.
  player-offline: The recipient must be online.
  recovery-scheduled: Recovery was requested for the original owner. Check the recipient's delivery result.
  inspect-entry: Artwork %s; owner %s; delivery %s; payment %s; quoted price %.2f.
  inspect-missing: No receipt exists for %s. Recovery requires first checking that no usable item or placed copy remains.
  resolved: Delivery record updated. This does not transfer items or money.
  resolve-payment-first: First confirm the economy transaction and resolve it as paid, unpaid or refunded.
  invalid-resolution: This payment resolution does not apply to the current record.
  operation-failed: 'Map management failed: %s'
map-copy:
  usage: Use /mapmanage copy while holding an image map.
  space: Leave one empty inventory slot for the new map.
  changed: Copy cancelled because the held map or destination slot changed. The original was kept.
  unavailable: An image copy is already running or the queue is full. Please wait.
  failed: The map could not be copied. The original was kept; check the server log.
  uncertain: The copy result could not be confirmed. Its image files were kept; check your inventory and the server log.
  copied: An independent copy was added to your inventory.
