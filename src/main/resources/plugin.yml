name: ReColorfulMap
version: '@version@'
main: cn.lunadeer.reColorfulMap.ReColorfulMap
api-version: '1.20'
load: STARTUP
folia-supported: true
softdepend: [Vault, VaultUnlocked]
commands:
  tomap:
    description: Convert image to map
    usage: /tomap <image url> [scale(default 1)]
    permission: recolorfulmap.tomap
  reloadColorfulMap:
    description: Reload ReColorfulMap configuration
    usage: /reloadColorfulMap
    permission: recolorfulmap.admin
  cleanColorfulMap:
    description: Clean temporary map storage files
    usage: /cleanColorfulMap
    permission: recolorfulmap.admin
  mapmanage:
    description: Manage map generation and pending deliveries
    usage: /mapmanage <status|cancel|list|claim|inspect|recover|resolve>
    permission: recolorfulmap.manage
permissions:
  recolorfulmap.tomap:
    default: true
  recolorfulmap.admin:
    default: op
  recolorfulmap.manage:
    default: true
